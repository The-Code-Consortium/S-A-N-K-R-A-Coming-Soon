<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="SANKĀRA 4x4 Checkered Wood &amp; Brass Emblem">
  <defs>
    <!-- Subtle linear gradients for refined architectural texture -->
    <linearGradient id="brass-frame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dfbead" />
      <stop offset="50%" stop-color="#ca9f88" />
      <stop offset="100%" stop-color="#b5876f" />
    </linearGradient>
    <linearGradient id="brass-cell-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dfbead" />
      <stop offset="100%" stop-color="#ca9f88" />
    </linearGradient>
    <linearGradient id="brass-cell-2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ca9f88" />
      <stop offset="100%" stop-color="#b5876f" />
    </linearGradient>
    <linearGradient id="walnut-cell-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#583c29" />
      <stop offset="100%" stop-color="#442c1c" />
    </linearGradient>
    <linearGradient id="walnut-cell-2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#483020" />
      <stop offset="100%" stop-color="#341f12" />
    </linearGradient>
  </defs>

  <!-- Outer Architectural Brass Bezel -->
  <rect x="2" y="2" width="96" height="96" rx="3" fill="none" stroke="url(#brass-frame)" stroke-width="2.5" />

  <!-- Inner Backing Field -->
  <rect x="6.5" y="6.5" width="87" height="87" rx="1.5" fill="#1b1c18" />

  <!-- 4x4 Signature Checkered Grid (19px x 19px per cell, 2px gap) -->
  <!-- Row 0 -->
  <rect x="9.5" y="9.5" width="19" height="19" rx="1" fill="url(#walnut-cell-1)" />
  <rect x="30.5" y="9.5" width="19" height="19" rx="1" fill="url(#brass-cell-1)" />
  <rect x="51.5" y="9.5" width="19" height="19" rx="1" fill="url(#walnut-cell-2)" />
  <rect x="72.5" y="9.5" width="19" height="19" rx="1" fill="url(#brass-cell-2)" />

  <!-- Row 1 -->
  <rect x="9.5" y="30.5" width="19" height="19" rx="1" fill="url(#brass-cell-2)" />
  <rect x="30.5" y="30.5" width="19" height="19" rx="1" fill="url(#walnut-cell-1)" />
  <rect x="51.5" y="30.5" width="19" height="19" rx="1" fill="url(#brass-cell-1)" />
  <rect x="72.5" y="30.5" width="19" height="19" rx="1" fill="url(#walnut-cell-2)" />

  <!-- Row 2 -->
  <rect x="9.5" y="51.5" width="19" height="19" rx="1" fill="url(#walnut-cell-2)" />
  <rect x="30.5" y="51.5" width="19" height="19" rx="1" fill="url(#brass-cell-1)" />
  <rect x="51.5" y="51.5" width="19" height="19" rx="1" fill="url(#walnut-cell-1)" />
  <rect x="72.5" y="51.5" width="19" height="19" rx="1" fill="url(#brass-cell-2)" />

  <!-- Row 3 -->
  <rect x="9.5" y="72.5" width="19" height="19" rx="1" fill="url(#brass-cell-1)" />
  <rect x="30.5" y="72.5" width="19" height="19" rx="1" fill="url(#walnut-cell-2)" />
  <rect x="51.5" y="72.5" width="19" height="19" rx="1" fill="url(#brass-cell-2)" />
  <rect x="72.5" y="72.5" width="19" height="19" rx="1" fill="url(#walnut-cell-1)" />
</svg>
